<script>
/* =========================================================
 * 세부 기능 화면: 일정·서류·체크리스트·만족도·교육·정산·추천·실적·공지·문의·문자
 * ========================================================= */
function won(n) { n = Number(String(n || 0).replace(/[^0-9.\-]/g, '')) || 0; return n.toLocaleString('ko-KR'); }
function inqBadge(st) { return '<span class="badge ' + ({ 접수: 'b-warn', 처리중: 'b-info', 완료: 'b-ok' }[st] || 'b-gray') + '">' + esc(st) + '</span>'; }
function bc(n) { return n ? ' (' + n + ')' : ''; }

function adminTabsList() {
  var b = S.badges || {};
  return [['dash', '대시보드'], ['apps', '신청'], ['projects', '사업장'], ['visits', '일정'], ['cons', '컨설턴트'], ['edu', '교육' + bc(b.교육신청)],
    ['fee', '정산' + bc(b.정산)], ['report', '실적'], ['board', '공지·문의' + bc(b.문의)], ['mail', '메일·문자'], ['sched', '차수일정'], ['settings', '설정']];
}
function consTabsList() {
  var b = S.badges || {};
  return [['mine', '내 사업장'], ['cvisits', '일정'], ['cedu', '교육' + bc(b.교육)], ['cnotice', '공지·자료' + bc(b.공지)], ['cinq', '문의'], ['cfee', '정산'], ['profile', '내 정보']];
}

/* ---------- 달력 ---------- */
function calendarHtml(ym, events, opt) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1;
  var first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), pad = first.getDay();
  var by = {};
  events.forEach(function (e) { (by[e['일자']] = by[e['일자']] || []).push(e); });
  var cells = [];
  for (var i = 0; i < pad; i++) cells.push('<div class="cal-cell empty"></div>');
  for (var d = 1; d <= days; d++) {
    var key = ym + '-' + ('0' + d).slice(-2), list = (by[key] || []).sort(function (a, b) { return (a['시작'] || '') < (b['시작'] || '') ? -1 : 1; });
    cells.push('<div class="cal-cell' + (key === TODAY ? ' today' : '') + '"><div class="cal-d">' + d + '</div>' + list.slice(0, 6).map(function (e) {
      return '<div class="cal-ev st-' + esc(e['상태'] || '예정') + '" data-ev="' + esc(e.ID) + '" title="' + esc((e['시작'] || '') + ' ' + e._사업장명 + ' · ' + e._컨설턴트명) + '">' +
        esc((e['시작'] || '') + ' ' + e._사업장명) + (opt && opt.showName ? ' · ' + esc(e._컨설턴트명) : '') + '</div>';
    }).join('') + (list.length > 6 ? '<div class="small muted">+' + (list.length - 6) + '</div>' : '') + '</div>');
  }
  return '<div class="cal"><div class="cal-h">일</div><div class="cal-h">월</div><div class="cal-h">화</div><div class="cal-h">수</div><div class="cal-h">목</div><div class="cal-h">금</div><div class="cal-h">토</div>' + cells.join('') + '</div>' +
    '<div class="legend" style="margin-top:8px"><span><i style="background:#2f6db5"></i>예정</span><span><i style="background:#1e8e5a"></i>완료</span><span><i style="background:#b9c2ce"></i>취소</span></div>';
}
function monthNav(ym) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var prev = m === 1 ? (y - 1) + '-12' : y + '-' + ('0' + (m - 1)).slice(-2), next = m === 12 ? (y + 1) + '-01' : y + '-' + ('0' + (m + 1)).slice(-2);
  return '<button class="btn sm" data-ym="' + prev + '">◀</button><b style="font-size:16px">' + y + '년 ' + m + '월</b><button class="btn sm" data-ym="' + next + '">▶</button><button class="btn sm" data-ym="' + TODAY.slice(0, 7) + '">이번 달</button>';
}
(function () {
  var css = document.createElement('style');
  css.textContent = '.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}' +
    '.cal-h{background:#f7f9fc;padding:6px;text-align:center;font-size:12px;color:var(--muted)}.cal-cell{background:#fff;min-height:96px;padding:4px 5px}.cal-cell.empty{background:#fafbfc}' +
    '.cal-cell.today{background:#f2f7ff}.cal-d{font-size:12px;color:var(--muted);margin-bottom:2px}.cal-ev{font-size:11px;border-radius:4px;padding:1px 5px;margin-bottom:2px;cursor:pointer;color:#fff;background:#2f6db5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
    '.cal-ev.st-완료{background:#1e8e5a}.cal-ev.st-취소{background:#b9c2ce;text-decoration:line-through}' +
    '.cl-row{display:grid;grid-template-columns:1fr 110px 1fr;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #f0f2f6;font-size:13px}' +
    '.stepper{display:flex;gap:6px;flex-wrap:wrap}.stepper div{flex:1;min-width:90px;text-align:center;padding:8px 4px;border-radius:8px;background:#eef1f5;font-size:12px;color:#667}.stepper div.on{background:#e3f4ec;color:var(--ok);font-weight:500}' +
    '.nitem{border-bottom:1px solid #f0f2f6;padding:10px 4px;cursor:pointer}.nitem.unread b{color:var(--brand2)}.nitem .body{white-space:pre-wrap;margin-top:6px;display:none;cursor:auto}.nitem.open .body{display:block}' +
    '@media print{.topbar,.no-print,.filters{display:none!important}main{padding:0}.section{break-inside:avoid;border:0}body{background:#fff}}' +
    '@media (max-width:760px){.cal-cell{min-height:64px}.cal-ev{font-size:10px}.cl-row{grid-template-columns:1fr}}';
  document.head.appendChild(css);
})();
function bindMonthNav(root, fn) { $$('[data-ym]', root).forEach(function (b) { b.onclick = function () { fn(b.dataset.ym); }; }); }

/* ---------- 관리자: 일정 ---------- */
function renderVisitsAdmin(ym) {
  ym = ym || S.visitYm || TODAY.slice(0, 7); S.visitYm = ym;
  var from = ym + '-01', to = ym + '-31';
  call('listVisits', tok(), from, to).then(function (list) {
    var f = S.f.visit = S.f.visit || {};
    var consOpts = uniq(list.map(function (v) { return v._컨설턴트명; })).sort();
    var rows = list.filter(function (v) { return (!f.c || v._컨설턴트명 === f.c) && (!f.st || v['상태'] === f.st); });
    $('#view').innerHTML = '<div class="filters">' + monthNav(ym) + '<span class="grow"></span><select id="vfC">' + opts(consOpts, f.c, '전체 컨설턴트') + '</select><select id="vfS">' + opts(S.options.일정상태, f.st, '전체 상태') + '</select>' +
      '<span class="count">' + rows.length + '건</span><button class="btn sm" id="vXls">엑셀</button></div><div id="calBox">' + calendarHtml(ym, rows, { showName: true }) + '</div>' +
      '<p class="small muted">일정은 컨설턴트가 사업장 상세의 [일정] 탭에서 등록합니다. 항목을 누르면 해당 사업장이 열립니다.</p>';
    bindMonthNav($('#view'), renderVisitsAdmin);
    $('#vfC').onchange = function () { f.c = this.value; renderVisitsAdmin(ym); };
    $('#vfS').onchange = function () { f.st = this.value; renderVisitsAdmin(ym); };
    $('#vXls').onclick = function () { exportXlsx('방문일정_' + ym, [{ k: '일자' }, { k: '시작' }, { k: '종료' }, { k: '_사업장명', l: '사업장' }, { k: '_차수', l: '차수' }, { k: '_컨설턴트명', l: '컨설턴트' }, { k: '방식' }, { k: '장소' }, { k: '상태' }, { k: '내용' }], rows); };
    $$('[data-ev]').forEach(function (e) { e.onclick = function () { var v = list.filter(function (x) { return x.ID === e.dataset.ev; })[0]; openProject(v['사업장ID'], 'visits'); }; });
  }, function (e) { toast(e.message, true); });
}

/* ---------- 컨설턴트: 일정 ---------- */
function renderVisitsCons(ym) {
  ym = ym || S.visitYm || TODAY.slice(0, 7); S.visitYm = ym;
  call('listVisits', tok(), ym + '-01', ym + '-31').then(function (list) {
    $('#view').innerHTML = '<div class="filters">' + monthNav(ym) + '<span class="grow"></span><select id="vNewP">' + '<option value="">사업장 선택해서 일정 추가</option>' +
      S.projects.map(function (p) { return '<option value="' + esc(p.ID) + '">' + esc(p['사업장명']) + ' (' + esc(p['차수']) + ')</option>'; }).join('') + '</select></div>' +
      calendarHtml(ym, list, {}) + '<p class="small muted">항목을 누르면 사업장 상세의 일정 탭이 열립니다. 일정을 등록하면 담당자에게 안내 메일을 보낼 수 있고, 같은 날 수행일지를 쓰면 \'완료\'로 바뀝니다.</p>';
    bindMonthNav($('#view'), renderVisitsCons);
    $('#vNewP').onchange = function () { if (this.value) openProject(this.value, 'visits'); };
    $$('[data-ev]').forEach(function (e) { e.onclick = function () { var v = list.filter(function (x) { return x.ID === e.dataset.ev; })[0]; openProject(v['사업장ID'], 'visits'); }; });
  }, function (e) { toast(e.message, true); });
}

/* ---------- 사업장 상세 추가 탭 ---------- */
function drawExtraSub(s, el, d, p, admin, reopen) {
  var ex = d.extra || {};
  if (s === 'visits') {
    var x = '<div class="section"><h3 id="vTitle">일정 등록</h3><div class="grid3" id="vForm">' +
      fieldsHtml([['일자', 'date'], ['시작', 'text', null, '시작 (예: 14:00)'], ['종료', 'text', null, '종료 (예: 16:00)'], ['방식', 'select', S.options.수행방식], ['장소'], ['상태', 'select', S.options.일정상태]], { 일자: TODAY, 방식: '방문', 상태: '예정' }) +
      '<div class="field full"><label>내용</label><input data-k="내용" placeholder="예: 착수 미팅, 공정 진단"></div></div><input type="hidden" id="vId">' +
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="vSave">저장</button><button class="btn hidden" id="vNew">새로 등록</button><span class="small muted">구글 캘린더에도 등록됩니다.</span></div></div>';
    x += '<div class="section"><h3>일정 ' + (ex.visits || []).length + '건</h3>' + ((ex.visits || []).length ? '<table class="t"><thead><tr><th>일자</th><th>시간</th><th>방식</th><th>장소</th><th>내용</th><th>상태</th><th>안내</th><th></th></tr></thead><tbody>' +
      ex.visits.map(function (v) {
        return '<tr><td class="nowrap">' + esc(v['일자']) + '</td><td class="nowrap">' + esc(v['시작']) + (v['종료'] ? '~' + esc(v['종료']) : '') + '</td><td>' + esc(v['방식']) + '</td><td>' + esc(v['장소']) + '</td><td>' + esc(v['내용']) + '</td><td>' + badge(v['상태']) + '</td>' +
          '<td class="small">' + (v['안내발송'] ? esc(v['안내발송'].slice(5, 16)) : '') + '</td><td class="nowrap"><button class="btn sm" data-ve="' + esc(v.ID) + '">수정</button> <button class="btn sm" data-vn="' + esc(v.ID) + '">담당자 안내</button> <button class="btn sm danger" data-vd="' + esc(v.ID) + '">삭제</button></td></tr>';
      }).join('') + '</tbody></table>' : '<span class="muted small">등록된 일정이 없습니다.</span>') + '</div>';
    el.innerHTML = x;
    $('#vSave', el).onclick = function () {
      var v = readFields($('#vForm', el)); v['사업장ID'] = p.ID; v.ID = $('#vId', el).value;
      run('저장 중...', 'saveVisit', tok(), v).then(function (nd) { toast('저장했습니다.'); reopen(nd, 'visits'); });
    };
    $('#vNew', el).onclick = function () { drawExtraSub('visits', el, d, p, admin, reopen); };
    $$('[data-ve]', el).forEach(function (b) { b.onclick = function () {
      var v = ex.visits.filter(function (z) { return z.ID === b.dataset.ve; })[0];
      $$('[data-k]', $('#vForm', el)).forEach(function (i) { i.value = v[i.dataset.k] || ''; });
      $('#vId', el).value = v.ID; $('#vTitle', el).textContent = v['일자'] + ' 일정 수정'; $('#vNew', el).classList.remove('hidden');
    }; });
    $$('[data-vn]', el).forEach(function (b) { b.onclick = function () { if (confirm('사업장 담당자에게 일정 안내 메일' + (S.sms ? '·문자' : '') + '를 보낼까요?')) run('발송 중...', 'notifyVisit', tok(), b.dataset.vn).then(function (nd) { toast('안내를 보냈습니다.'); reopen(nd, 'visits'); }); }; });
    $$('[data-vd]', el).forEach(function (b) { b.onclick = function () { if (confirm('일정을 삭제할까요? (캘린더에서도 삭제)')) run('삭제 중...', 'deleteVisit', tok(), b.dataset.vd).then(function (nd) { reopen(nd, 'visits'); }); }; });
    return;
  }
  if (s === 'docs') {
    var latest = {};
    (ex.docs || []).forEach(function (dd) { if (!latest[dd['종류']]) latest[dd['종류']] = dd; });
    var y = '<div class="section"><h3>필수 서류</h3><table class="t"><thead><tr><th>서류</th><th>상태</th><th>최근 제출</th><th>올리기</th></tr></thead><tbody>' +
      (ex.docTypes || []).map(function (t) {
        var dd = latest[t];
        return '<tr><td><b>' + esc(t) + '</b></td><td>' + (dd ? badge(dd['확인']) + (dd['의견'] ? '<div class="small" style="color:var(--bad)">' + esc(dd['의견']) + '</div>' : '') : '<span class="badge b-warn">미제출</span>') + '</td>' +
          '<td>' + (dd ? filesHtml(dd['파일'], false) + '<div class="small muted">' + esc(dd['제출일']) + '</div>' : '') +
          (admin && dd && dd['확인'] !== '확인' ? '<div class="row" style="margin-top:4px"><button class="btn sm primary" data-dok="' + esc(dd.ID) + '">확인</button><button class="btn sm danger" data-dno="' + esc(dd.ID) + '">반려</button></div>' : '') + '</td>' +
          '<td><div class="row"><input type="file" data-dfile="' + esc(t) + '" style="max-width:200px"><button class="btn sm" data-dup="' + esc(t) + '">올리기</button></div></td></tr>';
      }).join('') + '</tbody></table><p class="small muted">서류 종류는 설정의 DOC_TYPES에서 바꿉니다.' + (admin ? ' 관리자가 올린 서류는 바로 \'확인\' 처리됩니다.' : ' 올리면 관리자 확인 후 \'확인\'으로 바뀝니다.') + '</p></div>';
    var hist = (ex.docs || []);
    if (hist.length) y += '<div class="section"><h3>제출 이력</h3>' + hist.map(function (dd) { return '<div class="row small" style="padding:3px 0"><b>' + esc(dd['종류']) + '</b>' + badge(dd['확인']) + '<span class="muted">' + esc(dd['제출일']) + ' · ' + esc(dd['제출자']) + '</span></div>'; }).join('') + '</div>';
    el.innerHTML = y;
    $$('[data-dup]', el).forEach(function (b) { b.onclick = function () {
      readFiles($('[data-dfile="' + b.dataset.dup + '"]', el), S.maxMb).then(function (files) {
        if (!files.length) throw new Error('파일을 선택해 주세요.');
        return run('올리는 중...', 'uploadDoc', tok(), p.ID, b.dataset.dup, files);
      }).then(function (nd) { toast('올렸습니다.'); reopen(nd, 'docs'); }, function (e) { toast(e.message, true); });
    }; });
    $$('[data-dok]', el).forEach(function (b) { b.onclick = function () { run('저장 중...', 'adminReviewDoc', tok(), b.dataset.dok, '확인', '').then(function (nd) { reopen(nd, 'docs'); }); }; });
    $$('[data-dno]', el).forEach(function (b) { b.onclick = function () { var why = prompt('반려 사유 (컨설턴트에게 메일로 전달)'); if (why !== null) run('저장 중...', 'adminReviewDoc', tok(), b.dataset.dno, '반려', why).then(function (nd) { reopen(nd, 'docs'); }); }; });
    return;
  }
  if (s === 'survey') {
    var sv = ex.surveys || [];
    var z = '<div class="section"><h3>만족도 설문</h3>' + (sv.length ? sv.map(function (r) {
      var sc = parseFiles(r['점수']);
      return '<div class="card" style="padding:12px;margin-bottom:8px"><div class="row"><b>' + (r['응답일'] ? '종합 ' + esc(r['종합']) + '점' : '미응답') + '</b><span class="muted small">발송 ' + esc(r['발송일']) + (r['응답일'] ? ' · 응답 ' + esc(r['응답일']) + ' · ' + esc(r['응답자']) : '') + '</span></div>' +
        (sc.length ? '<table class="t" style="margin-top:6px"><tbody>' + sc.map(function (q) { return '<tr><td>' + esc(q['문항']) + '</td><td style="width:60px"><b>' + esc(q['점수']) + '</b>/5</td></tr>'; }).join('') + '</tbody></table>' : '') +
        (r['의견'] ? '<div class="notice-box small" style="margin-top:6px">' + esc(r['의견']) + '</div>' : '') + '</div>';
    }).join('') : '<p class="muted small">아직 발송하지 않았습니다.</p>') +
      '<div class="row"><button class="btn" id="svSend">' + (sv.length ? '설문 다시 보내기' : '사업장 담당자에게 설문 보내기') + '</button></div></div>';
    var fs = ex.settlements || [];
    z += '<div class="section"><h3>정산</h3>' + (fs.length ? '<table class="t"><thead><tr><th>항목</th><th>컨설턴트</th><th>금액</th><th>상태</th><th>발생일</th><th>지급일</th></tr></thead><tbody>' + fs.map(function (f) {
      return '<tr><td>' + esc(f['항목']) + '</td><td>' + esc(f._컨설턴트명) + '</td><td>' + won(f['금액']) + '원</td><td>' + badge(f['상태']) + '</td><td>' + esc(f['발생일']) + '</td><td>' + esc(f['지급일']) + '</td></tr>';
    }).join('') + '</tbody></table>' : '<p class="muted small">정산 내역이 없습니다. (보고서가 검수완료되면 수당기준에 따라 생성)</p>') + '</div>';
    el.innerHTML = z;
    $('#svSend', el).onclick = function () {
      run('발송 중...', 'adminSendSurvey', tok(), [p.ID], sv.length > 0).then(function (r) { toast(r.sent ? '설문을 보냈습니다.' : '보내지 않았습니다: ' + r.skipped.join(', '), !r.sent); openProject(p.ID, 'survey'); });
    };
    return;
  }
  if (s === 'fee') {
    var mf = ex.settlements || [];
    el.innerHTML = '<div class="section"><h3>이 사업장 정산</h3>' + (mf.length ? '<table class="t"><thead><tr><th>항목</th><th>금액</th><th>상태</th><th>발생일</th><th>지급일</th></tr></thead><tbody>' + mf.map(function (f) {
      return '<tr><td>' + esc(f['항목']) + '</td><td>' + won(f['금액']) + '원</td><td>' + badge(f['상태']) + '</td><td>' + esc(f['발생일']) + '</td><td>' + esc(f['지급일']) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted small">아직 정산 내역이 없습니다.</p>') + '</div>';
  }
}

/* ---------- 검수 체크리스트 ---------- */
function checklistView(r, admin) {
  var saved = parseFiles(r['체크리스트']);
  var items = admin ? (S.options.체크리스트 || {})[r['종류']] || [] : [];
  if (!admin) {
    if (!saved.length) return '';
    var bad = saved.filter(function (x) { return x['결과'] === '부적합'; });
    return '<div class="small" style="margin-top:6px">체크리스트: 적합 ' + saved.filter(function (x) { return x['결과'] === '적합'; }).length + ' · <b style="color:var(--bad)">부적합 ' + bad.length + '</b></div>';
  }
  var map = {}; saved.forEach(function (x) { map[x['항목']] = x; });
  var all = items.concat(saved.map(function (x) { return x['항목']; }).filter(function (t) { return items.indexOf(t) < 0; }));
  if (!all.length) return '';
