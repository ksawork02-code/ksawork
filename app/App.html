<script>
/* ================= 상태 ================= */
var S = { f: {}, sort: {}, view: {} };
var TODAY = (function () { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })();
function tok() { return getToken(); }
function dday(due) { if (!due) return null; var a = new Date(TODAY + 'T00:00:00'), b = new Date(String(due).slice(0, 10) + 'T00:00:00'); if (isNaN(b)) return null; return Math.round((b - a) / 86400000); }
function uniq(arr) { var m = {}; return arr.filter(function (x) { if (x === '' || x === undefined || m[x]) return false; m[x] = 1; return true; }); }
function opts(list, cur, blank) { return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (v) { return '<option' + (String(v) === String(cur) ? ' selected' : '') + ' value="' + esc(v) + '">' + esc(v || '(없음)') + '</option>'; }).join(''); }
function chasuOrder(c) { return parseInt(c, 10) || 999; }

/* ================= 시작 ================= */
(function boot() {
  restoreToken(function () {
    if (!tok()) return showLogin();
    call('me', tok()).then(function (u) { startRole(u); }, function () { setToken(''); showLogin(); });
  });
})();

function startRole(u) {
  if (u.role === 'admin') adminBoot(); else consBoot();
}

function showLogin() {
  $('#root').innerHTML = '<div class="center"><div class="card loginbox"><h2 style="margin:0 0 4px;color:var(--brand)">' + esc(document.title) + '</h2>' +
    '<p class="muted small" style="margin:0 0 16px">등록된 이메일로 인증코드를 받아 로그인합니다.</p>' +
    '<div id="step1"><div class="field"><label>이메일</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email"></div>' +
    '<button class="btn primary" style="width:100%;margin-top:12px" id="sendBtn">인증코드 받기</button></div>' +
    '<div id="step2" class="hidden"><p class="small">메일로 받은 6자리 코드를 입력하세요. (10분간 유효)</p><div class="field"><input id="code" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:20px;letter-spacing:6px;text-align:center"></div>' +
    '<button class="btn primary" style="width:100%;margin-top:12px" id="verifyBtn">로그인</button><button class="btn" style="width:100%;margin-top:6px" id="backBtn">이메일 다시 입력</button></div>' +
    '<p class="muted small" style="margin-top:16px">로그인하면 이 기기에서 30일간 유지됩니다.</p></div></div>';
  var email = $('#email');
  try { email.value = localStorage.getItem('ccm_email') || ''; } catch (e) {}
  $('#sendBtn').onclick = function () {
    run('인증코드 발송 중...', 'requestOtp', email.value).then(function () {
      try { localStorage.setItem('ccm_email', email.value.trim()); } catch (e) {}
      $('#step1').classList.add('hidden'); $('#step2').classList.remove('hidden'); $('#code').focus();
      toast('인증코드를 메일로 보냈습니다.');
    });
  };
  email.onkeydown = function (e) { if (e.key === 'Enter') $('#sendBtn').click(); };
  $('#code').onkeydown = function (e) { if (e.key === 'Enter') $('#verifyBtn').click(); };
  $('#backBtn').onclick = function () { $('#step2').classList.add('hidden'); $('#step1').classList.remove('hidden'); };
  $('#verifyBtn').onclick = function () {
    run('확인 중...', 'verifyOtp', email.value, $('#code').value).then(function (r) { setToken(r.token); startRole(r.user); });
  };
}

function logoutNow() { call('logout', tok()).then(null, function () {}); setToken(''); location.reload(); }

/* ================= 공통 UI ================= */
function shell(tabs, cur, onTab, userLabel) {
  $('#root').innerHTML = '<div class="topbar"><h1>' + esc(document.title) + '</h1><nav class="tabs">' +
    tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (t[0] === cur ? ' class="on"' : '') + '>' + esc(t[1]) + '</button>'; }).join('') +
    '</nav><span class="user">' + esc(userLabel) + '</span><button class="btn sm" id="logoutBtn">로그아웃</button></div><main id="view"></main>';
  $$('.tabs button').forEach(function (b) {
    b.onclick = function () { $$('.tabs button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); onTab(b.dataset.tab); };
  });
  $('#logoutBtn').onclick = logoutNow;
  onTab(cur);
}

function badge(s) {
  var c = { '검수완료': 'b-ok', '확정': 'b-ok', '협약완료': 'b-ok', '문서협약완료': 'b-ok', '활동': 'b-ok', 'Y': 'b-ok', '2 사업장 연락완료': 'b-ok',
    '검수 중': 'b-info', '제출': 'b-info', '착수메일 발송': 'b-info', '1 컨설턴트 연락완료': 'b-info',
    '보완요청': 'b-bad', '반려': 'b-bad', '1.5 컨설 확인필요': 'b-warn', '대기': 'b-warn', '신청': 'b-warn', '협약서명필요': 'b-warn', '문서협약진행': 'b-warn', '착수준비': 'b-warn', '미확인': 'b-warn' }[s] || 'b-gray';
  return s ? '<span class="badge ' + c + '">' + esc(s) + '</span>' : '';
}
function ddBadge(dd) {
  if (dd === null || dd === undefined) return '';
  if (dd < 0) return '<span class="badge b-bad">' + (-dd) + '일 초과</span>';
  if (dd <= 7) return '<span class="badge b-warn">' + (dd === 0 ? 'D-day' : 'D-' + dd) + '</span>';
  return '<span class="badge b-gray">D-' + dd + '</span>';
}
function reportCell(p, t) {
  var c = { 중간: ['중간검수', '중간기한'], 최종: ['최종검수', '최종기한'], 사후: ['사후검수', '사후기한'] }[t];
  var st = p[c[0]] || '미제출', due = p[c[1]];
  var late = (st === '미제출' || st === '보완요청') && dday(due) !== null && dday(due) < 0;
  return badge(st) + (due ? '<div class="small ' + (late ? '' : 'muted') + '" style="' + (late ? 'color:var(--bad)' : '') + '">' + esc(due.slice(5)) + '</div>' : '');
}

/** 정렬 가능한 표 */
function table(el, key, cols, rows, onRow) {
  var st = S.sort[key] || {};
  if (st.k) {
    var col = cols.filter(function (c) { return c.k === st.k; })[0];
    var val = col && (col.s || col.x) ? (col.s || col.x) : function (r) { return r[st.k]; };
    rows = rows.slice().sort(function (a, b) {
      var x = val(a), y = val(b);
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * st.d;
      return String(x === undefined ? '' : x).localeCompare(String(y === undefined ? '' : y), 'ko', { numeric: true }) * st.d;
    });
  }
  var shown = rows.slice(0, 1500);
  el.innerHTML = '<div class="tablewrap"><table class="t"><thead><tr>' + cols.map(function (c) {
    return '<th data-k="' + esc(c.k) + '">' + esc(c.l || c.k) + (st.k === c.k ? (st.d > 0 ? ' ▲' : ' ▼') : '') + '</th>';
  }).join('') + '</tr></thead><tbody>' + shown.map(function (r, i) {
    return '<tr data-i="' + i + '">' + cols.map(function (c) { return '<td' + (c.nw ? ' class="nowrap"' : '') + '>' + (c.f ? c.f(r) : esc(r[c.k])) + '</td>'; }).join('') + '</tr>';
  }).join('') + (shown.length ? '' : '<tr><td colspan="' + cols.length + '" class="muted" style="text-align:center;padding:30px">데이터가 없습니다.</td></tr>') + '</tbody></table></div>';
  $$('th', el).forEach(function (th) { th.onclick = function () { var k = th.dataset.k; S.sort[key] = { k: k, d: st.k === k ? -st.d : 1 }; table(el, key, cols, rows, onRow); }; });
  $$('tbody tr[data-i]', el).forEach(function (tr) { tr.onclick = function () { onRow(shown[Number(tr.dataset.i)]); }; });
}

/** 칸반: 카드를 끌어서 다른 열에 놓으면 onMove(row, newValue) */
function kanban(el, groups, rows, keyFn, cardFn, onClick, onMove) {
  var by = {}; groups.forEach(function (g) { by[g] = []; });
  rows.forEach(function (r) { var g = keyFn(r) || ''; (by[g] = by[g] || []).push(r); if (groups.indexOf(g) < 0) groups.push(g); });
  el.innerHTML = '<div class="kanban">' + groups.map(function (g) {
    return '<div class="kcol" data-g="' + esc(g) + '"><h4><span>' + esc(g || '(미지정)') + '</span><span class="muted">' + by[g].length + '</span></h4>' +
      by[g].slice(0, 300).map(function (r) { return '<div class="kcard" draggable="' + (onMove ? 'true' : 'false') + '" data-id="' + esc(r.ID) + '">' + cardFn(r) + '</div>'; }).join('') + '</div>';
  }).join('') + '</div>';
  var find = function (id) { return rows.filter(function (r) { return r.ID === id; })[0]; };
  $$('.kcard', el).forEach(function (c) {
    c.onclick = function () { onClick(find(c.dataset.id)); };
    c.ondragstart = function (e) { e.dataTransfer.setData('text', c.dataset.id); };
  });
  if (onMove) $$('.kcol', el).forEach(function (col) {
    col.ondragover = function (e) { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = function () { col.classList.remove('over'); };
    col.ondrop = function (e) { e.preventDefault(); col.classList.remove('over'); var r = find(e.dataTransfer.getData('text')); if (r && keyFn(r) !== col.dataset.g) onMove(r, col.dataset.g); };
  });
}

/* 드로어 */
function drawer(title, html, extraHead) {
  closeDrawer();
  var bg = document.createElement('div'); bg.className = 'drawer-bg'; bg.onclick = closeDrawer;
  var d = document.createElement('div'); d.className = 'drawer';
  d.innerHTML = '<header><h2>' + title + '</h2>' + (extraHead || '') + '<button class="btn sm" data-close>닫기 ✕</button></header><div class="body">' + html + '</div>';
  document.body.appendChild(bg); document.body.appendChild(d);
  $('[data-close]', d).onclick = closeDrawer;
  document.onkeydown = function (e) { if (e.key === 'Escape') closeDrawer(); };
  return d;
}
function closeDrawer() { $$('.drawer,.drawer-bg').forEach(function (x) { x.remove(); }); document.onkeydown = null; }

/* 필드 폼: defs = [[키, 타입, 옵션목록, 라벨, full]] */
function fieldsHtml(defs, vals, ro) {
  return defs.map(function (d) {
    var k = d[0], type = d[1] || 'text', o = d[2], label = d[3] || k, full = d[4] || type === 'textarea' || type === 'multi';
    var v = vals[k] === undefined ? '' : vals[k], inp;
    if (ro) inp = '<div>' + (type === 'select' ? badge(v) || '-' : esc(v) || '<span class="muted">-</span>') + '</div>';
    else if (type === 'select') inp = '<select data-k="' + k + '">' + opts([''].concat(uniq((o || []).concat([v]))), v) + '</select>';
    else if (type === 'textarea') inp = '<textarea data-k="' + k + '">' + esc(v) + '</textarea>';
    else if (type === 'multi') {
      var sel = String(v).split(',').map(function (x) { return x.trim(); }).filter(String);
      inp = '<div class="chips" data-k="' + k + '" data-multi="1">' + uniq((o || []).concat(sel)).map(function (x) {
        return '<span class="chip' + (sel.indexOf(x) >= 0 ? ' on' : '') + '" data-v="' + esc(x) + '">' + esc(x) + '</span>';
      }).join('') + '</div>';
    } else inp = '<input data-k="' + k + '" type="' + (type === 'date' ? 'date' : type === 'number' ? 'number' : 'text') + '" value="' + esc(type === 'date' ? String(v).slice(0, 10) : v) + '">';
    return '<div class="field' + (full ? ' full' : '') + '"><label>' + esc(label) + '</label>' + inp + '</div>';
  }).join('');
}
function bindChips(root) {
  $$('.chips[data-multi] .chip', root).forEach(function (c) { c.onclick = function () { c.classList.toggle('on'); }; });
}
function readFields(root) {
  var o = {};
  $$('[data-k]', root).forEach(function (el) {
    if (el.dataset.multi) o[el.dataset.k] = $$('.chip.on', el).map(function (c) { return c.dataset.v; }).join(', ');
    else if (el.dataset.cpick !== undefined) return;
    else o[el.dataset.k] = el.value;
  });
  return o;
}

/* 컨설턴트 선택기 */
function cpickHtml(ids) {
  return '<div class="cpick" data-cpick="1" data-ids="' + esc(ids || '') + '"><div class="chips" style="margin-bottom:6px"></div>' +
    '<input list="consDl" placeholder="이름으로 검색해서 추가"></div>';
}
function bindCpick(root) {
  if (!$('#consDl')) {
    var dl = document.createElement('datalist'); dl.id = 'consDl';
    dl.innerHTML = (S.consultants || []).filter(function (c) { return c['상태'] !== '제외'; }).map(function (c) { return '<option value="' + esc(c['성명'] + ' · ' + (c['이메일'] || c['구분']) + ' #' + c.ID) + '">'; }).join('');
    document.body.appendChild(dl);
  }
  $$('.cpick', root).forEach(function (el) {
    var draw = function () {
      var ids = el.dataset.ids.split(',').filter(String);
      $('.chips', el).innerHTML = ids.map(function (id) {
        var c = (S.consultants || []).filter(function (x) { return x.ID === id; })[0];
        return '<span class="chip on" data-id="' + esc(id) + '">' + esc(c ? c['성명'] : id) + ' ✕</span>';
      }).join('') || '<span class="muted small">배정된 컨설턴트 없음</span>';
      $$('.chip', el).forEach(function (ch) { ch.onclick = function () { el.dataset.ids = ids.filter(function (x) { return x !== ch.dataset.id; }).join(','); draw(); }; });
    };
    var inp = $('input', el);
    inp.onchange = function () {
      var m = inp.value.match(/#([A-Z0-9-]+)$/);
      if (m) { var ids = el.dataset.ids.split(',').filter(String); if (ids.indexOf(m[1]) < 0) ids.push(m[1]); el.dataset.ids = ids.join(','); draw(); }
      inp.value = '';
    };
    draw();
  });
}
function cpickIds(root) { var el = $('.cpick', root); return el ? el.dataset.ids.split(',').filter(String) : []; }
function guessConsultants(text) {
  return uniq(String(text || '').split(/[,\/\s]+/).map(function (n) {
    var c = (S.consultants || []).filter(function (x) { return x['성명'] === n.trim(); })[0]; return c ? c.ID : '';
  }));
}

/* 파일 목록 */
function filesHtml(files, edit) {
  files = parseFiles(files);
  var h = '<div class="files">' + (files.length ? files.map(function (f) {
    if (f.lark) return '<div class="file">⏳ ' + esc(f.name) + ' <span class="muted small">' + (f.fail >= 3 ? '이관 실패' : '이관 대기') + '</span></div>';
    return '<div class="file">📎 <a data-dl="' + esc(f.id) + '">' + esc(f.name) + '</a> <span class="muted small">' + fsize(f.size) + '</span>' +
      (edit ? ' <button class="btn sm danger" data-rmfile="' + esc(f.id) + '">삭제</button>' : '') + '</div>';
  }).join('') : '<span class="muted small">파일 없음</span>') + '</div>';
  if (edit) h += '<div class="row" style="margin-top:6px"><input type="file" multiple class="grow" data-up><button class="btn sm" data-upbtn>업로드</button></div>';
  return h;
}
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('[data-dl]');
  if (!a) return;
  run('파일을 가져오는 중...', 'downloadFile', tok(), a.dataset.dl).then(function (r) {
    if (r.tooLarge) { window.open(r.url, '_blank'); return; }
    saveB64(r.b64, r.name, r.mime);
  });
});
/** 관리자용 파일 블록 바인딩 */
function bindFileBlock(el, sheet, id, field, onDone) {
  var up = $('[data-upbtn]', el);
  if (up) up.onclick = function () {
    readFiles($('[data-up]', el)).then(function (files) {
      if (!files.length) return toast('파일을 선택해 주세요.', true);
      return run('업로드 중...', 'adminAddFiles', tok(), sheet, id, field, files).then(onDone);
    }).catch(function (e) { toast(e.message, true); });
  };
  $$('[data-rmfile]', el).forEach(function (b) {
    b.onclick = function () { if (confirm('파일을 삭제할까요? (드라이브 휴지통으로 이동)')) run('삭제 중...', 'adminRemoveFile', tok(), sheet, id, field, b.dataset.rmfile).then(onDone); };
  });
}

function ruleLabel(r) { return r ? (r.allow.length ? r.allow.map(function (x) { return '.' + x; }).join(', ') + ' 파일만' : '') + (r.block.length ? (r.allow.length ? ' · ' : '') + r.block.map(function (x) { return '.' + x; }).join(', ') + ' 불가' : '') : ''; }
/* 모든 파일 입력: 선택 즉시 기본 차단 확장자 확인 (보고서·신청서 입력은 개별 규칙) */
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || t.type !== 'file' || t.id === 'rFiles' || !S.fileRules) return;
  var rule = t.closest('[data-fb="신청서"]') ? S.fileRules.신청서 : S.fileRules.기본;
  var m = extError(t, rule); if (m) { toast(m, true); t.value = ''; }
});
function exportXlsx(title, cols, rows) {
  var headers = cols.map(function (c) { return c.l || c.k; });
  var data = rows.map(function (r) { return cols.map(function (c) { var v = c.x ? c.x(r) : r[c.k]; return v === undefined || v === null ? '' : String(v); }); });
  run('엑셀 파일 만드는 중...', 'adminExportXlsx', tok(), title, headers, data).then(function (r) {
    saveB64(r.b64, r.name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  });
}

function historyHtml(list) {
  if (!list || !list.length) return '<span class="muted small">변경 이력이 없습니다.</span>';
  return '<div class="tablewrap" style="max-height:300px"><table class="t"><thead><tr><th>일시</th><th>사용자</th><th>작업</th><th>필드</th><th>이전</th><th>변경</th></tr></thead><tbody>' +
    list.map(function (h) { return '<tr><td class="nowrap">' + esc(h['일시']) + '</td><td>' + esc(h['사용자']) + '</td><td>' + esc(h['작업']) + '</td><td>' + esc(h['필드']) + '</td><td>' + esc(String(h['이전값']).slice(0, 80)) + '</td><td>' + esc(String(h['변경값']).slice(0, 80)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
}

/* ================= 관리자 ================= */
var APP_DEFS = [['구분', 'select', 'opt:구분'], ['연도'], ['승인여부', 'select', 'opt:승인여부'], ['연락여부', 'select', 'opt:연락여부'], ['사업장명'], ['사업자등록번호'], ['업태'], ['종목'],
  ['근로자수', 'number'], ['사업장주소'], ['사업장지역'], ['지역본부'], ['담당부서'], ['담당자명'], ['담당자직책'], ['담당자연락처'], ['담당자이메일'], ['희망컨설턴트'],
  ['연락담당자', 'text', null, '연락 담당자(내부)'], ['변동사항', 'select', 'opt:변동사항'], ['특이사항', 'textarea'], ['비고', 'textarea']];
var PROJECT_DEFS = [['사업장명'], ['연도'], ['차수', 'select', 'opt:차수'], ['착수현황', 'select', 'opt:착수현황'], ['착수일', 'date'], ['종료일', 'date'],
  ['중간기한', 'date'], ['중간검수', 'select', 'opt:검수'], ['최종기한', 'date'], ['최종검수', 'select', 'opt:검수'], ['사후기한', 'date'], ['사후검수', 'select', 'opt:검수'],
  ['중간제출일', 'date'], ['최종제출일', 'date'], ['사후제출일', 'date'], ['정책연계여부', 'select', 'opt:YN'], ['정책연계사업', 'multi', 'opt:정책연계사업'], ['기타사업'],
  ['정책연계시기', 'multi', 'opt:정책연계시기'], ['우수사례여부', 'select', 'opt:YN'], ['비고', 'textarea']];

    if (t === 'pick') { var pk = cpickIds($('#view')); list = S.consultants.filter(function (c) { return pk.indexOf(c.ID) >= 0 && c['이메일']; }).map(function (c) { return { email: c['이메일'], phone: c['연락처'], id: c.ID, vars: { 성명: c['성명'] } }; }); }
    if (t === 'company') list = S.projects.filter(function (p) { return p['차수'] === ch; }).map(function (p) {
      var a = S.apps.filter(function (x) { return x.ID === p['신청ID']; })[0]; return a && a['담당자이메일'] ? { email: a['담당자이메일'], phone: a['담당자연락처'], id: p.ID, vars: { 성명: a['담당자명'], 담당자명: a['담당자명'], 사업장명: p['사업장명'] } } : null;
    }).filter(Boolean);
    return list;
  };
  var upd = function () { if (!$('#mTarget')) return; $('#mPickWrap').classList.toggle('hidden', $('#mTarget').value !== 'pick'); $('#mCount').textContent = '대상 ' + targets().length + '명'; };
  $('#mTarget').onchange = upd; $('#mChasu').onchange = upd; $('#view').addEventListener('click', function () { setTimeout(upd, 50); }); $('.cpick input').addEventListener('change', function () { setTimeout(upd, 50); });
  upd();
  $('#mSend').onclick = function () {
    var list = targets();
    if (!list.length) return toast('받는 사람이 없습니다.', true);
    if (!$('#mSubj').value.trim() || !$('#mBody').value.trim()) return toast('제목과 본문을 입력해 주세요.', true);
    if (!confirm(list.length + '명에게 메일을 보낼까요?')) return;
    var smsOn = $('#mSmsOn') && $('#mSmsOn').checked && $('#mSms').value.trim();
    run('발송 중...', 'adminSendMail', tok(), list, $('#mSubj').value, $('#mBody').value).then(function (r) {
      toast(r.sent + '건 발송 · 오늘 남은 한도 ' + r.quota + '건');
      if (smsOn) return run('문자 발송 중...', 'adminSendSmsBulk', tok(), list.filter(function (x) { return x.phone; }), $('#mSms').value).then(function (q) { toast('메일 ' + r.sent + '건 · 문자 ' + q.sent + '건 발송'); });
    });
  };
  $('#mLoad').onclick = function () {
    run('불러오는 중...', 'adminMailLog', tok()).then(function (rows) {
      $('#mLog').innerHTML = '<div class="tablewrap" style="max-height:400px"><table class="t"><thead><tr><th>일시</th><th>받는사람</th><th>제목</th><th>종류</th><th>결과</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td class="nowrap">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td>' + (r[5] === 'OK' ? '<span class="badge b-ok">OK</span>' : '<span class="badge b-bad">' + esc(r[5]) + '</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    });
  };
}

/* ---------- 설정 ---------- */
function renderSettings() {
  run('불러오는 중...', 'adminGetSettings', tok()).then(function (rows) {
    var url = S.appUrl || '';
    var pub = !/script\.google(usercontent)?\.com/.test(url);
    var links = [['기업 컨설팅 신청폼', pub ? '/apply' : '?page=apply'], ['차년도 사전접수 폼', pub ? '/pre' : '?page=pre'], ['컨설턴트 신청폼', pub ? '/consultant' : '?page=consultant'], ['로그인(관리자·컨설턴트)', '']];
    var h = '<div class="section"><h3>배포 링크</h3>' + (url ? links.map(function (l) {
      return '<div class="row" style="margin-bottom:6px"><span style="width:180px">' + l[0] + '</span><input readonly value="' + esc(url + l[1]) + '" class="grow"><button class="btn sm" data-copy="' + esc(url + l[1]) + '">복사</button><a class="btn sm" href="' + esc(url + l[1]) + '" target="_blank">열기</a></div>';
    }).join('') : '<span class="muted">웹앱 배포 후 표시됩니다.</span>') + '</div>';
    h += '<div class="section" id="larkBox"><h3>Lark 연동 (전환 기간)</h3><div class="muted small">불러오는 중...</div></div>';
    h += '<div class="section" id="smsBox"></div>';
    h += '<div class="section"><h3>설정</h3><div class="grid2" id="setForm">' + rows.filter(function (r) { return ['DRIVE_ROOT_ID', 'APP_URL', 'LARK_SYNC', 'LARK_SYNC_MINUTES', 'LARK_SYNC_LAST'].indexOf(r['키']) < 0; }).map(function (r) {
      var long = String(r['값']).length > 60 || /NOTICE|BODY/.test(r['키']);
      return '<div class="field' + (long ? ' full' : '') + '"><label><b>' + esc(r['키']) + '</b> · ' + esc(r['설명']) + '</label>' + (long ? '<textarea data-set="' + esc(r['키']) + '">' + esc(r['값']) + '</textarea>' : '<input data-set="' + esc(r['키']) + '" value="' + esc(r['값']) + '">') + '</div>';
    }).join('') + '</div><div class="row" style="margin-top:12px"><button class="btn primary" id="saveSet">설정 저장</button>' +
      (rows.filter(function (r) { return r['키'] === 'DRIVE_ROOT_ID'; })[0] ? '<a class="btn" target="_blank" href="https://drive.google.com/drive/folders/' + esc(rows.filter(function (r) { return r['키'] === 'DRIVE_ROOT_ID'; })[0]['값']) + '">파일 폴더 열기</a>' : '') + '</div></div>';
    $('#view').innerHTML = h;
    $$('[data-copy]').forEach(function (b) { b.onclick = function () { navigator.clipboard.writeText(b.dataset.copy).then(function () { toast('복사했습니다.'); }, function () { toast('복사하지 못했습니다. 직접 선택해 복사해 주세요.', true); }); }; });
    loadLarkBox(); drawSmsBox();
    $('#saveSet').onclick = function () {
      var pairs = {}; $$('[data-set]').forEach(function (i) { pairs[i.dataset.set] = i.value; });
      run('저장 중...', 'adminSaveSettings', tok(), pairs).then(function () { toast('저장했습니다.'); });
    };
  });
}

function loadLarkBox() {
  call('adminLarkSyncStatus', tok()).then(drawLarkBox, function (e) { $('#larkBox').innerHTML = '<h3>Lark 연동</h3><span class="muted small">' + esc(e.message) + '</span>'; });
}
function drawLarkBox(st) {
  var box = $('#larkBox'); if (!box) return;
  box.innerHTML = '<h3>Lark 연동 (전환 기간)</h3>' +
    '<p class="small muted" style="margin-top:0">Lark에 입력된 내용을 정해진 간격으로 앱에 가져옵니다(Lark → 앱 한 방향). 새 레코드는 추가하고, Lark에서 바뀐 항목만 반영하며 앱에서만 고친 값은 유지합니다. 같은 칸을 양쪽에서 고쳤다면 Lark 값이 우선이고 이전 값은 변경이력에 남습니다.</p>' +
    '<div class="row" style="margin-bottom:8px">상태 ' + (st.on ? '<span class="badge b-ok">켜짐 · ' + esc(st.minutes) + '분마다</span>' : '<span class="badge b-gray">꺼짐</span>') +
    (st.hasSecret ? ' <span class="badge b-info">App Secret 저장됨</span>' : ' <span class="badge b-warn">App Secret 없음</span>') + '</div>' +
    '<div class="small" style="margin-bottom:10px">마지막 결과: ' + (esc(st.last) || '<span class="muted">-</span>') + '</div>' +
    '<div class="row"><button class="btn" id="lkNow"' + (st.hasSecret ? '' : ' disabled') + '>지금 동기화</button>' +
    (st.on ? '<button class="btn danger" id="lkOff">동기화 끄기 (전환 완료)</button>' :
      '<select id="lkMin" style="width:auto">' + opts(['5', '10', '15', '30'], st.minutes || '30') + '</select><span class="small">분마다</span><button class="btn primary" id="lkOn"' + (st.hasSecret ? '' : ' disabled') + '>자동 동기화 켜기</button>') + '</div>' +
    (st.hasSecret ? '' : '<p class="small muted">App Secret은 보안상 구글 시트 메뉴 [컨설팅 관리 > Lark 자동 동기화 켜기]에서 처음 한 번 입력합니다.</p>');
  if ($('#lkNow')) $('#lkNow').onclick = function () { run('Lark에서 가져오는 중... (최대 1~2분)', 'adminLarkSync', tok(), 'now').then(function (r) { drawLarkBox(r); toast('동기화했습니다.'); Promise.all(['apps', 'projects', 'consultants'].map(reload)); }); };
  if ($('#lkOn')) $('#lkOn').onclick = function () { run('켜는 중...', 'adminLarkSync', tok(), 'on', $('#lkMin').value).then(function (r) { drawLarkBox(r); toast('자동 동기화를 켰습니다.'); }); };
  if ($('#lkOff')) $('#lkOff').onclick = function () { if (confirm('자동 동기화를 끄고 저장된 Lark App Secret을 삭제할까요? (Lark 전환 완료 시)')) run('끄는 중...', 'adminLarkSync', tok(), 'off').then(function (r) { drawLarkBox(r); toast('동기화를 껐습니다.'); }); };
}

/* ================= 컨설턴트 화면 ================= */
function consBoot() {
  run('불러오는 중...', 'consultantBootstrap', tok()).then(function (r) {
    Object.assign(S, r);
    shell(consTabsList(), 'mine', function (t) { S.tab = t; closeDrawer();
      ({ mine: renderMine, cvisits: renderVisitsCons, cedu: renderEduCons, cnotice: renderNoticeCons, cinq: renderInqCons, cfee: renderFeeCons, profile: renderProfile })[t](); }, S.me.name + ' 컨설턴트');
  });
}
function renderMine() {
  var ps = S.projects.slice().sort(function (a, b) { return (a._next && a._next.dday !== null ? a._next.dday : 9999) - (b._next && b._next.dday !== null ? b._next.dday : 9999); });
  var g = S.profile['개인별안내'];
  var h = (g ? '<div class="notice-box" style="margin-bottom:12px"><b>📢 개인별 안내</b>\n' + esc(g) + '</div>' : '') +
    '<div class="row" style="margin-bottom:12px"><h2 style="margin:0;font-size:17px">담당 사업장 ' + ps.length + '곳</h2><span class="grow"></span><span class="muted small">문의: ' + esc(S.contact) + '</span></div>';
  h += '<div class="pcards">' + (ps.map(function (p) {
    return '<div class="pcard" data-p="' + esc(p.ID) + '"><div class="row"><h3 class="grow">' + esc(p['사업장명']) + '</h3>' + badge(p['차수']) + '</div>' +
      '<div class="small muted">' + esc(p['착수일']) + ' ~ ' + esc(p['종료일']) + ' · 일지 ' + esc(p['수행일지수'] || 0) + '건</div>' +
      '<div style="margin-top:8px">' + (p._next ? '<b>' + esc(p._next.종류) + '보고서</b> ' + (p._next.상태 === '보완요청' ? badge('보완요청') + ' ' : '') + ddBadge(p._next.dday) + ' <span class="small muted">' + esc(p._next.기한) + '</span>' : badge(p._단계)) + '</div>' +
      '<div class="steps">' + ['중간', '최종', '사후'].map(function (t) { return '<div>' + t + '<br>' + badge(p[t + '검수'] || '미제출') + '</div>'; }).join('') + '</div></div>';
  }).join('') || '<div class="card muted">배정된 사업장이 없습니다.</div>') + '</div>';
  $('#view').innerHTML = h;
  $$('[data-p]').forEach(function (c) { c.onclick = function () { openProject(c.dataset.p); }; });
}
function renderProfile() {
  var c = S.profile;
  var h = '<div class="section"><h3>내 정보</h3><div class="grid2" id="myForm">' + fieldsHtml([['성명'], ['이메일']], c, true) + fieldsHtml([['연락처'], ['주요활동지역', 'text', null, '주요 활동 지역']], c) + '</div>' +
    '<div class="field" style="margin-top:10px"><label>이력서</label>' + filesHtml(c['이력서'], false) + '<input type="file" id="myCv" multiple style="margin-top:6px"></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn primary" id="saveMe">저장</button><span class="muted small">이름·이메일 변경은 관리자에게 문의해 주세요.</span></div></div>';
  if (c['개인별안내']) h += '<div class="section"><h3>개인별 안내</h3><div class="notice-box">' + esc(c['개인별안내']) + '</div></div>';
  h += '<div class="section"><h3>교육 이수 현황 · 총 ' + S.totalHours + '시간</h3>' + (S.trainings.length ? '<table class="t"><thead><tr><th>일자</th><th>교육</th><th>이수 시간</th></tr></thead><tbody>' +
    S.trainings.map(function (t) { return '<tr><td>' + esc(t['일자']) + '</td><td>' + esc(t['교육명']) + '</td><td>' + esc(t['이수시간']) + '시간</td></tr>'; }).join('') + '</tbody></table>' : '<span class="muted small">이수 기록이 없습니다.</span>') + '</div>';
  $('#view').innerHTML = h;
  $('#saveMe').onclick = function () {
    readFiles($('#myCv')).then(function (files) { return run('저장 중...', 'updateMyProfile', tok(), readFields($('#myForm')), files); })
      .then(function (r) { Object.assign(S, r); toast('저장했습니다.'); renderProfile(); }, function (e) { toast(e.message, true); });
  };
}
</script>
