<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e3e7ee;--text:#1d2633;--muted:#6b7686;--brand:#1f3a5f;--brand2:#2f6db5;
  --ok:#1e8e5a;--warn:#c27c0e;--bad:#c93b3b;--info:#2f6db5;--soft:#eef3fa;--radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.5 'Noto Sans KR',system-ui,sans-serif}
a{color:var(--brand2)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3f0;border-color:var(--brand2)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:#255a98}
.btn.danger{color:var(--bad);border-color:#efc6c6}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;background:#eef1f5;color:#445;white-space:nowrap}
.b-ok{background:#e3f4ec;color:var(--ok)}.b-warn{background:#fdf2df;color:var(--warn)}.b-bad{background:#fbe6e6;color:var(--bad)}
.b-info{background:#e6effa;color:var(--info)}.b-gray{background:#eef1f5;color:#667}
.topbar{background:var(--brand);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:54px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.tabs button{background:none;border:0;color:#c9d6e8;padding:16px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:#7fb2f0;font-weight:500}
.topbar .user{font-size:12px;color:#c9d6e8;white-space:nowrap}
.topbar .btn{background:transparent;color:#fff;border-color:#4b6587}
main{padding:20px;max-width:1500px;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{width:auto;min-width:110px}
.filters input[type=search]{min-width:200px}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);max-height:calc(100vh - 210px)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-weight:500;color:#556;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
table.t td{padding:7px 10px;border-bottom:1px solid #f0f2f6;vertical-align:top}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#f6f9fe}
table.t td.nowrap{white-space:nowrap}
.count{color:var(--muted);font-size:13px}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,30,45,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer header h2{margin:0;font-size:17px;flex:1}
.drawer .body{overflow:auto;padding:16px 18px;flex:1}
.section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.section h3{margin:0 0 10px;font-size:14px;color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:16px;padding:3px 10px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.files{display:flex;flex-direction:column;gap:4px}
.file{display:flex;align-items:center;gap:8px;font-size:13px}
.file a{cursor:pointer;text-decoration:underline}
.subtabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer}
.subtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{background:#e9edf3;border-radius:var(--radius);min-width:250px;width:250px;padding:8px;max-height:calc(100vh - 220px);overflow:auto}
.kcol h4{margin:4px 6px 8px;font-size:13px;display:flex;justify-content:space-between}
.kcol.over{outline:2px dashed var(--brand2)}
.kcard{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;font-size:13px}
.kcard:hover{border-color:#bcd3f0}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;color:var(--brand)}
.kpi .l{font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.bars .bar{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.bars .track{background:#eef1f5;border-radius:4px;height:14px;overflow:hidden;display:flex}
.bars .fill{background:var(--brand2);height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* login / form pages */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:min(400px,100%)}
.formpage{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.formpage .head{background:var(--brand);color:#fff;border-radius:var(--radius) var(--radius) 0 0;padding:22px 24px}
.formpage .head h1{margin:0 0 4px;font-size:20px}
.formpage .notice{background:#fff;border:1px solid var(--line);border-top:0;padding:16px 24px;white-space:pre-wrap;color:#445;font-size:13px}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-top:10px}
.q label.t{font-weight:500;display:block;margin-bottom:2px}
.q .d{font-size:12px;color:var(--muted);margin-bottom:8px}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:4px}
/* overlay / toast */
#overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spinner{width:34px;height:34px;border:3px solid #cfdcec;border-top-color:var(--brand2);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2633;color:#fff;padding:10px 18px;border-radius:8px;z-index:95;max-width:90vw;font-size:13px}
#toast.bad{background:var(--bad)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.pcard:hover{border-color:#bcd3f0;box-shadow:0 2px 10px rgba(30,60,100,.06)}
.pcard h3{margin:0 0 4px;font-size:15px}
.steps{display:flex;gap:6px;margin-top:10px}
.steps div{flex:1;text-align:center;font-size:11px}
.timeline .item{border-left:3px solid #d5deea;padding:6px 12px;margin-bottom:8px}
.notice-box{background:#fff8e6;border:1px solid #f0dca8;border-radius:8px;padding:10px 14px;white-space:pre-wrap}
@media (max-width:760px){
  .grid2,.grid3{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px}
  .topbar h1{font-size:14px;flex:1}
  .tabs{order:3;flex-basis:100%}
  .tabs button{padding:10px 12px}
  main{padding:12px}
  .bars .bar{grid-template-columns:90px 1fr 36px}
}
</style>
